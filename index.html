<body style="margin:0; overflow:hidden; background:transparent; -webkit-app-region:drag; font:14px sans-serif">
  <div id="hint" style="margin:10px; padding:14px; background:rgba(30,30,30,.9); color:#eee; border-radius:10px; text-align:center; box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 2px 12px rgba(0,0,0,.5)">Drag me, then paste an image (&#8984;V)</div>
  <img id="img" style="display:none; opacity:.5">
  <script>
    const { ipcRenderer } = require('electron');
    const img = document.getElementById('img');
    const hint = document.getElementById('hint');

    const PLUS_KEYS = ['=', '+'];
    const MINUS_KEYS = ['-', '_'];
    const CLEAR_KEYS = ['Escape', 'Backspace', 'Delete'];
    const NUDGE_KEYS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };

    let baseW = 0;
    let baseH = 0;
    let zoom = 1;

    function apply() {
      if (!baseW) return;
      const w = Math.round(baseW * zoom);
      const h = Math.round(baseH * zoom);
      img.style.width = w + 'px';
      ipcRenderer.send('resize', w, h);
    }

    ipcRenderer.on('opacity', (_e, v) => { img.style.opacity = v; });

    document.addEventListener('paste', async (e) => {
      const file = [...e.clipboardData.items].find((i) => i.type.startsWith('image/'))?.getAsFile();
      if (!file) return;
      let scale = 1;
      if (file.type === 'image/png') {
        const b = new DataView(await file.arrayBuffer());
        for (let i = 8; i + 12 <= b.byteLength; i += b.getUint32(i) + 12) {
          if (b.getUint32(i + 4) === 0x70485973) {
            scale = Math.min(2, Math.max(1, Math.round(b.getUint32(i + 8) * 0.0254 / 72)));
            break;
          }
        }
      }
      img.onload = () => {
        baseW = img.naturalWidth / scale;
        baseH = img.naturalHeight / scale;
        zoom = 1;
        img.style.display = 'block';
        hint.hidden = true;
        apply();
      };
      img.src = URL.createObjectURL(file);
    });

    document.addEventListener('keydown', (e) => {
      if (PLUS_KEYS.includes(e.key) || MINUS_KEYS.includes(e.key)) {
        const dir = PLUS_KEYS.includes(e.key) ? 1 : -1;
        if (e.metaKey || e.ctrlKey) {
          zoom = Math.min(10, Math.max(0.1, zoom + dir * 0.1));
          apply();
        } else {
          ipcRenderer.send('opacity-step', dir);
        }
      }
      if (e.key === '0' && (e.metaKey || e.ctrlKey)) {
        zoom = 1;
        apply();
      }
      if (NUDGE_KEYS[e.key]) {
        const step = e.shiftKey ? 10 : 1;
        ipcRenderer.send('nudge', NUDGE_KEYS[e.key][0] * step, NUDGE_KEYS[e.key][1] * step);
      }
      if (CLEAR_KEYS.includes(e.key)) {
        img.style.display = 'none';
        img.removeAttribute('src');
        hint.hidden = false;
        baseW = baseH = 0;
        zoom = 1;
        ipcRenderer.send('resize', 400, 100);
      }
    });
  </script>
</body>
